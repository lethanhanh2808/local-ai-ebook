<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig configuration for sharp/libvips text rendering.

  The static libvips shipped with @img/sharp-libvips-* has fontconfig built in
  but ships with no default config and no font directories registered. Without
  this file, SVG <text> elements render with a stub font that lacks glyph
  coverage for non-ASCII scripts (Chinese, Japanese, Vietnamese diacritics,
  most accented Latin, etc.), producing tofu boxes (□) for those codepoints.

  Pointing at /app/public/assets/fonts (where Literata lives) restores normal
  rendering. The base conf include is ignored if /etc/fonts/fonts.conf is
  missing — typical of node:20-bookworm-slim, which has no fontconfig package.
-->
<fontconfig>
  <dir>/app/public/assets/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <!-- Try to inherit system-wide config if any; harmless when absent. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Default font + families used by `<font-family="serif">`/etc. in SVG.
       Pango falls through to these when the requested family is missing. -->
  <alias>
    <family>serif</family>
    <prefer><family>Literata</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Literata</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Literata</family></prefer>
  </alias>
</fontconfig>
