# Container stack for the ebook converter. Runs alongside the host stack on
# side-channel ports so both can coexist for real end-to-end testing.
#
# Usage:
#   docker compose up -d --build           # build + start in background
#   docker compose logs -f app worker      # tail logs
#   docker compose down                    # stop + remove containers (keep volumes)
#   docker compose down -v                 # also wipe redis-data volume
#
# Ports chosen to avoid colliding with the host stack:
#   13100 -> app :3100     (host dev server stays on :3100)
#   16379 -> redis :6379   (host redis stays on :6379)
#
# The container reaches the host's oMLX (:8080) and Unified TTS (:5010) via
# host.docker.internal (works out-of-the-box on Docker Desktop for Mac/Windows).
# The host-side env vars UNIFIED_TTS_URL / OMLX_BASE_URL in .env.local are
# intentionally overridden here so the same env file works in both contexts.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '16379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    restart: unless-stopped
    # SQLite needs ~1s to flush the WAL on shutdown; the default 10s
    # SIGKILL would lose the last transaction. 30s is generous.
    stop_grace_period: 30s
    stop_signal: SIGTERM
    ports:
      - '13100:3100'
    env_file: .env.local
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=file:/app/data/ebook-converter.db
      # Override local URLs so the container can reach host-local services.
      # Host's unified TTS aggregator / VieNeu server runs on :5020 (see
      # .env.local). Pointing the container at :5010 was a leftover from
      # the legacy Piper+MOSS-Nano aggregator that has since been retired.
      - UNIFIED_TTS_URL=http://host.docker.internal:5020
      - TTS_SERVICE_URL=http://host.docker.internal:5020
      # VieNeu now runs IN THIS STACK on `tts-vieneu` (see below) — the
      # VM becomes self-sufficient for read-aloud when the Mac is off.
      # F5 still runs on the Mac (MLX/GPU-bound) so its URL keeps using
      # the literal Mac IP set in .env.local.
      - VIENEU_BASE_URL=http://tts-vieneu:5020
      - OMLX_BASE_URL=http://host.docker.internal:8080/v1
      # .env.local sets TTS_PYTHON to a host-machine absolute path
      # (/Library/Frameworks/...) that doesn't exist inside the container;
      # the worker would then `spawn python3.11 ENOENT` for every chapter.
      # The container installs python3 in the runner stage (Dockerfile:107)
      # so `python3` on PATH is the right binary here.
      - TTS_PYTHON=python3
      - NODE_ENV=production
      # Next.js standalone server.js binds to process.env.HOSTNAME if set,
      # which Docker defaults to the container's hostname / bridge IP, causing
      # the loopback healthcheck (127.0.0.1:3100) to ECONNREFUSED. Pin both
      # HOSTNAME and HOST=0.0.0.0 so the server listens on all interfaces.
      - HOSTNAME=0.0.0.0
      - HOST=0.0.0.0
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/app/data
      - ./public/assets/fonts:/app/public/assets/fonts:ro
      # tts-service: sibling Python project (character_detector.py + venv).
      # AI Character Detection runs the Python module via `spawn`; without
      # this mount, `character_detector.py not found` and the route 500s.
      # Read-only because the container never needs to write into it.
      - ../tts-service:/app/tts-service:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "node -e \"require('http').get('http://127.0.0.1:3100/api/tts/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    # NOTE: worker is a BullMQ consumer, not an HTTP client. It depends on
    # Redis only — never on `app`. Sharing ./data means app + worker see the
    # same SQLite database.
    build: .
    restart: unless-stopped
    # Same graceful-shutdown story as `app` — see comment there.
    stop_grace_period: 30s
    stop_signal: SIGTERM
    command: node worker.js
    env_file: .env.local
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=file:/app/data/ebook-converter.db
      - UNIFIED_TTS_URL=http://host.docker.internal:5020
      - TTS_SERVICE_URL=http://host.docker.internal:5020
      - VIENEU_BASE_URL=http://tts-vieneu:5020
      - OMLX_BASE_URL=http://host.docker.internal:8080/v1
      # Same TTS_PYTHON override as the app service — see comment there.
      - TTS_PYTHON=python3
      - NODE_ENV=production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/app/data
      - ./public/assets/fonts:/app/public/assets/fonts:ro
      # Same tts-service mount as `app` so the worker can spawn
      # character_detector.py for in-pipeline character bible pre-seeding.
      - ../tts-service:/app/tts-service:ro
    depends_on:
      redis:
        condition: service_healthy

  # ── tts-vieneu ─────────────────────────────────────────────────────────
  # Vietnamese-native TTS engine, runs on the VM (CPU inference — no GPU
  # required, unlike F5). Adds a self-contained read-aloud fallback so the
  # app keeps working when the Mac is off / unreachable.
  #
  # First-time setup (run ONCE on the host, not inside this container):
  #   bash ../tts-service/scripts/setup_vieneu.sh
  # That clones thinhlpg/VieNeu-TTS, creates the uv venv with Python 3.11,
  # and installs the `vieneu` package. We exec the venv's python directly
  # so the container image stays at python:3.11-slim + zero installs.
  tts-vieneu:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app/tts-service
    # Bind to 0.0.0.0 so other containers on the default docker network can
    # reach us; the previous default (127.0.0.1) was a foot-gun.
    # The .venv/bin/python symlink targets ~/.local/share/uv/python/...
    # which lives OUTSIDE the bind mount → exec returns ENOENT inside the
    # container. The bind-mounted bin/docker-python.sh wrapper execs the
    # container's /usr/local/bin/python3.11 with PYTHONPATH pointing at
    # the venv's site-packages, so vieneu + deps resolve correctly.
    command: ["/app/tts-service/bin/docker-python.sh", "/app/tts-service/vieneu_server.py"]
    stop_grace_period: 30s
    stop_signal: SIGTERM
    environment:
      - VIENEU_HOST=0.0.0.0
      - VIENEU_PORT=5020
      - PYTHONUNBUFFERED=1
      # Pin the HuggingFace cache into the bind mount so the ~1.2 GB ONNX
      # v3-turbo weights survive container restarts. Default is
      # ~/.cache/huggingface → /root/.cache/huggingface inside this
      # container, which is on the overlay filesystem and gets wiped each
      # `docker compose up`. Host bind mount keeps it across restarts.
      - HF_HOME=/app/tts-service/.cache/huggingface
    volumes:
      # RW so the `vieneu` package can drop its model-weight cache
      # (~1.2 GB) into the bind-mounted dir on first run. App + worker
      # still bind the same path RO; their views stay consistent because
      # tts-vieneu only writes to the venv-side cache, never to source
      # files the app reads.
      - ../tts-service:/app/tts-service
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:5020/health', timeout=3); sys.exit(0 if r.status==200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # model load is slow on cold cache

volumes:
  redis-data:
